<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Círculo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<link rel="icon" href="icons/icon-192.png?v=3">
<title>Círculo</title>
<style>
:root{
  --bg:#0b0b1a;
  --text:#f4f4fb;
  --muted:rgba(235,235,255,.58);
  --faint:rgba(235,235,255,.32);
  --glass:rgba(255,255,255,.075);
  --glass-2:rgba(255,255,255,.12);
  --stroke:rgba(255,255,255,.14);
  --accent:#7b7bff;
  --accent-2:#39c2f0;
  --danger:#ff6b81;
  --spring:cubic-bezier(.22,1.2,.36,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --r:22px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
button{background:none;border:0;cursor:pointer}

/* Fondo vivo */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 22s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;background:#5856d6;top:-20vmax;left:-15vmax}
.b2{width:50vmax;height:50vmax;background:#1fa2d8;bottom:-18vmax;right:-15vmax;animation-duration:26s}
.b3{width:35vmax;height:35vmax;background:#b44cd9;top:40%;left:45%;opacity:.28;animation-duration:30s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.12)}}

/* Vidrio */
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.25)}

.app{position:relative;z-index:1;height:100%}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 110px);-webkit-overflow-scrolling:touch;transition:opacity .35s var(--ease),transform .45s var(--ease)}
.screen.hidden{opacity:0;transform:scale(.97);pointer-events:none}

h1{font-size:34px;font-weight:750;letter-spacing:-.6px;margin:6px 4px 14px}
h2{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:22px 6px 10px}

/* Buscador */
.search{display:flex;align-items:center;gap:10px;border-radius:16px;padding:11px 14px;margin-bottom:14px}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px}
.search input::placeholder{color:var(--faint)}
.search svg{opacity:.55;flex:none}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;font-size:14px;font-weight:550;color:var(--muted);transition:all .3s var(--spring)}
.chip.on{color:#fff;background:var(--glass-2);border-color:rgba(255,255,255,.3)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* Tarjetas */
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.card{display:flex;align-items:center;gap:14px;border-radius:var(--r);padding:13px 14px;transition:transform .25s var(--spring),background .2s;animation:rise .5s var(--spring) both}
.card:active,.press:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.25)}
.card .info{flex:1;min-width:0}
.card .name{font-weight:620;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;background:rgba(255,190,80,.18);color:#ffc86b;border:1px solid rgba(255,190,80,.28)}

.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;line-height:1.5;animation:rise .6s var(--spring) both}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}

/* Barra inferior */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 14px);display:flex;gap:4px;padding:6px;border-radius:999px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;padding:7px 0 6px;border-radius:999px;font-size:11px;font-weight:600;color:var(--muted);transition:color .3s}
.tab.on{color:#fff}
.tab svg{width:23px;height:23px}
.pill{position:absolute;top:6px;left:6px;height:calc(100% - 12px);width:84px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:transform .5s var(--spring)}

.fab{position:fixed;z-index:21;right:18px;bottom:calc(var(--sb) + 90px);width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:0 10px 28px rgba(80,90,255,.45),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .35s var(--spring),opacity .3s}
.fab:active{transform:scale(.9)}
.fab.hide{transform:scale(0);opacity:0}

/* Paneles (detalle) */
.panel{position:fixed;inset:0;z-index:30;background:rgba(14,14,34,.86);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);overflow-y:auto;padding:calc(var(--st) + 12px) 18px calc(var(--sb) + 110px);transform:translateX(100%);transition:transform .5s var(--ease)}
.panel.open{transform:none}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.hero{text-align:center;margin:6px 0 18px;animation:rise .55s var(--spring) both}
.hero .av{width:92px;height:92px;font-size:34px;margin:0 auto 12px}
.hero .big{font-size:27px;font-weight:750;letter-spacing:-.4px}
.hero .tag{display:inline-block;margin-top:8px;font-size:13px;padding:5px 12px;border-radius:999px}

.box{border-radius:var(--r);padding:4px 16px;animation:rise .55s var(--spring) both}
.row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.row:last-child{border-bottom:0}
.row .k{flex:none;width:92px;font-size:13.5px;color:var(--muted);padding-top:1px}
.row .v{flex:1;font-size:15px;line-height:1.4;word-break:break-word;user-select:text}
.row .v.none{color:var(--faint)}

.pend{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.pend:last-child{border-bottom:0}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,190,80,.6);display:grid;place-items:center;transition:all .3s var(--spring)}
.pend.done .check{background:#ffb84d;border-color:#ffb84d;transform:scale(1.08)}
.pend.done .t{text-decoration:line-through;color:var(--faint)}
.pend .t{flex:1;font-size:15px;transition:color .3s}

.timeline{position:relative;padding-left:22px;margin-top:4px}
.timeline:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(var(--accent),transparent)}
.note{position:relative;border-radius:18px;padding:12px 14px;margin-bottom:10px;animation:rise .5s var(--spring) both}
.note:before{content:"";position:absolute;left:-21px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(123,123,255,.2)}
.note .d{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
.note .x{font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;user-select:text}
.note .del{color:var(--faint);font-size:12px}

.composer{position:fixed;z-index:31;left:12px;right:12px;bottom:calc(var(--sb) + 12px);display:flex;gap:8px;align-items:flex-end;padding:8px;border-radius:26px}
.composer textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:120px;padding:9px 10px;font-size:16px;line-height:1.35}
.composer textarea::placeholder{color:var(--faint)}
.send{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent-2));transition:transform .3s var(--spring),opacity .2s}
.send:disabled{opacity:.35}
.send:active{transform:scale(.88)}

/* Hojas (bottom sheet) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .35s;display:none}
.scrim.open{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;border-radius:30px 30px 0 0;padding:10px 18px calc(var(--sb) + 22px);background:rgba(28,28,48,.72);transform:translateY(105%);transition:transform .55s var(--spring)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin:4px auto 14px}
.sheet h3{font-size:21px;font-weight:720;margin:0 4px 16px;letter-spacing:-.3px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 6px 6px}
.field input,.field textarea,.field select{width:100%;border-radius:15px;padding:13px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);outline:0;transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(123,123,255,.7);background:rgba(255,255,255,.1)}
.field textarea{resize:none;min-height:84px;line-height:1.4}
.field select option{background:#1c1c30}
.field input[type=date]{min-height:48px}
.btn{width:100%;padding:15px;border-radius:17px;font-weight:650;font-size:16px;background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:0 8px 22px rgba(80,90,255,.35),inset 0 1px 0 rgba(255,255,255,.35);margin-top:6px;transition:transform .3s var(--spring)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);box-shadow:none;border:1px solid var(--stroke)}
.btn.red{background:rgba(255,107,129,.15);color:var(--danger);box-shadow:none;border:1px solid rgba(255,107,129,.3)}
.btn+.btn{margin-top:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border-radius:20px;padding:18px 14px;text-align:left;transition:transform .3s var(--spring)}
.opt:active{transform:scale(.96)}
.opt svg{margin-bottom:10px}
.opt b{display:block;font-size:16px}
.opt span{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.07);margin-bottom:12px;font-size:15px}
.sw{width:50px;height:30px;border-radius:30px;background:rgba(255,255,255,.18);position:relative;transition:background .3s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.sw.on{background:#ffb84d}
.sw.on:after{transform:translateX(20px)}
.pick{max-height:220px;overflow-y:auto;border-radius:16px;background:rgba(255,255,255,.05);margin-bottom:12px}
.pick .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.pick .it:last-child{border-bottom:0}
.pick .it .av{width:34px;height:34px;font-size:13px}
.pick .it.sel{background:rgba(123,123,255,.2)}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin:4px 4px 14px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;transition:transform .3s var(--spring)}
.colors button.sel{border-color:#fff;transform:scale(1.1)}

/* Calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.calhead .m{font-size:21px;font-weight:700;text-transform:capitalize}
.cal{border-radius:var(--r);padding:12px 10px}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk div{font-size:12px;color:var(--faint);font-weight:600;padding-bottom:8px}
.day{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:14px;font-size:15px;font-weight:520;transition:background .25s,transform .3s var(--spring)}
.day:active{transform:scale(.9)}
.day.out{color:var(--faint)}
.day.today{color:#fff;font-weight:750}
.day.today:before{content:"";position:absolute;inset:6px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent-2));z-index:-1}
.day{z-index:0}
.day.sel{background:rgba(255,255,255,.13)}
.dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%}
.i-bd{background:#ff7eb6}.i-ev{background:#5ad1ff}.i-pn{background:#ffb84d}
.legend{display:flex;gap:14px;justify-content:center;margin:12px 0 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.evt{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;margin-bottom:8px;animation:rise .45s var(--spring) both}
.evt .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.evt .tx{flex:1;min-width:0}
.evt .tx b{display:block;font-size:15px;font-weight:600}
.evt .tx span{font-size:13px;color:var(--muted)}

/* Ajustes */
.setrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15.5px}
.setrow:last-child{border-bottom:0}
.setrow .grow{flex:1}
.setrow .dot{width:12px;height:12px;border-radius:50%}
.hint{font-size:13px;color:var(--muted);margin:10px 6px;line-height:1.45}

.dlg{position:fixed;inset:0;z-index:55;display:none;place-items:center;padding:30px;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
.dlg.open{opacity:1}
.dlg .card2{width:100%;max-width:320px;border-radius:26px;padding:22px 18px 16px;text-align:center;background:rgba(34,34,58,.8);transform:scale(.9);transition:transform .4s var(--spring)}
.dlg.open .card2{transform:none}
.dlg p{font-size:16px;line-height:1.4;margin-bottom:16px}
.dlg .bts{display:flex;gap:10px}
.dlg .bts button{flex:1;padding:13px;border-radius:15px;font-weight:650}
.dlg .no{background:rgba(255,255,255,.1)}
.dlg .yes{background:rgba(255,107,129,.2);color:var(--danger);border:1px solid rgba(255,107,129,.35)}
.note .pen{opacity:.4}
.toast{position:fixed;z-index:60;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-200%);opacity:0;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .5s var(--spring),opacity .3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="app">
  <section class="screen" id="s-people">
    <h1>Personas</h1>
    <div class="search glass">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar nombre o nota" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="people"></div>
  </section>

  <section class="screen hidden" id="s-cal">
    <h1>Calendario</h1>
    <div class="calhead">
      <button class="iconbtn glass press" id="prevM"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="m" id="mlabel"></div>
      <button class="iconbtn glass press" id="nextM"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="cal glass">
      <div class="wk"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
      <div class="days" id="days"></div>
      <div class="legend"><span><i class="i-bd"></i>Cumpleaños</span><span><i class="i-ev"></i>Evento</span></div>
    </div>
    <h2 id="dayTitle"></h2>
    <div id="dayList"></div>
    <h2>Próximos 30 días</h2>
    <div id="upcoming"></div>
  </section>

  <section class="screen hidden" id="s-set">
    <h1>Ajustes</h1>
    <h2>Grupos</h2>
    <div class="box glass" id="groupList"></div>
    <button class="btn ghost press" id="addGroup" style="margin-top:10px">Nuevo grupo</button>
    <h2>Respaldo</h2>
    <p class="hint">Todo se guarda solo en este teléfono. Exporta un respaldo de vez en cuando.</p>
    <button class="btn ghost press" id="exportBtn">Exportar respaldo</button>
    <button class="btn ghost press" id="importBtn">Importar respaldo</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <h2>Zona peligrosa</h2>
    <button class="btn red press" id="wipeBtn">Borrar todo</button>
  </section>
</div>

<button class="fab" id="fab" aria-label="Agregar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabbar glass">
  <div class="pill" id="pill"></div>
  <button class="tab on" data-tab="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2A5 5 0 0 1 21.5 19"/></svg>Personas</button>
  <button class="tab" data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendario</button>
  <button class="tab" data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Ajustes</button>
</nav>

<div class="panel" id="panel"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet"></div>
<div class="toast glass" id="toast"></div>
<div class="dlg" id="dlg"><div class="card2 glass"><p id="dlgMsg"></p><div class="bts"><button class="no" id="dlgNo">Cancelar</button><button class="yes" id="dlgYes">Borrar</button></div></div></div>

<script>
/* ---------- Datos ---------- */
const KEY = 'circulo.v1';
const COLORS = ['#ff5e8a','#7b7bff','#39c2f0','#34d399','#ffb84d','#b46cff','#ff8a5c','#8e9bb3'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const defaults = () => ({
  groups: [
    { id: 'pareja', name: 'Pareja', color: '#ff5e8a' },
    { id: 'familia', name: 'Familia', color: '#ffb84d' },
    { id: 'trabajo', name: 'Trabajo', color: '#39c2f0' },
    { id: 'uni', name: 'Universidad', color: '#7b7bff' }
  ],
  people: [],
  events: []
});
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch (e) { db = defaults(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tap = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
const group = id => db.groups.find(g => g.id === id) || { name: 'Sin grupo', color: '#8e9bb3' };
const person = id => db.people.find(p => p.id === id);
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const avStyle = c => `background:linear-gradient(140deg,${c},${c}99)`;
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
function nice(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const t = new Date(); t.setHours(12, 0, 0, 0);
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  if (diff === -1) return 'Mañana';
  return `${d.getDate()} ${MES[d.getMonth()].slice(0, 3)}${d.getFullYear() !== t.getFullYear() ? ' ' + d.getFullYear() : ''}`;
}
function ask(msg, yes = 'Borrar') {
  return new Promise(res => {
    const d = $('#dlg'); $('#dlgMsg').textContent = msg; $('#dlgYes').textContent = yes;
    d.style.display = 'grid'; requestAnimationFrame(() => d.classList.add('open'));
    const done = v => { tap(); d.classList.remove('open'); setTimeout(() => d.style.display = 'none', 250); res(v); };
    $('#dlgYes').onclick = () => done(true); $('#dlgNo').onclick = () => done(false);
    d.onclick = e => { if (e.target === d) done(false); };
  });
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- Navegación ---------- */
let tab = 'people';
document.querySelectorAll('.tab').forEach((b, i) => b.onclick = () => {
  tap(); tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  $('#pill').style.transform = `translateX(${i * 88}px)`;
  ['people', 'cal', 'set'].forEach(s => $('#s-' + s).classList.toggle('hidden', s !== tab));
  $('#fab').classList.toggle('hide', tab === 'set');
  if (tab === 'cal') renderCal(); if (tab === 'set') renderSettings(); if (tab === 'people') renderPeople();
});

/* ---------- Personas ---------- */
let filter = 'all';
function renderChips() {
  const all = [{ id: 'all', name: 'Todos' }, ...db.groups];
  $('#chips').innerHTML = all.map(g => `<button class="chip glass ${filter === g.id ? 'on' : ''}" data-g="${g.id}">${g.color ? `<span class="dot" style="background:${g.color}"></span>` : ''}${esc(g.name)}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(c => c.onclick = () => { tap(); filter = c.dataset.g; renderPeople(); });
}
function lastNote(p) { return p.notes.length ? p.notes[0] : null; }
function renderPeople() {
  renderChips();
  const q = $('#q').value.trim().toLowerCase();
  let list = db.people.filter(p => filter === 'all' || p.groupId === filter);
  if (q) list = list.filter(p => [p.name, p.trick, p.met, p.likes, ...p.notes.map(n => n.text)].join(' ').toLowerCase().includes(q));
  list.sort((a, b) => (b.updated || 0) - (a.updated || 0));
  if (!list.length) {
    $('#people').innerHTML = db.people.length
      ? `<div class="empty"><b>Sin resultados</b>Prueba con otro nombre o grupo.</div>`
      : `<div class="empty"><b>Tu círculo está vacío</b>Toca el botón + para agregar a la primera persona.</div>`;
    return;
  }
  $('#people').innerHTML = list.map((p, i) => {
    const g = group(p.groupId), ln = lastNote(p);
    const pend = p.pending.filter(x => !x.done).length;
    const sub = ln ? `${nice(ln.date)} · ${esc(ln.text)}` : esc(g.name);
    return `<div class="card glass" data-id="${p.id}" style="animation-delay:${Math.min(i, 10) * 35}ms">
      <div class="av" style="${avStyle(g.color)}">${esc(initials(p.name))}</div>
      <div class="info"><div class="name">${esc(p.name)}</div><div class="sub">${sub}</div></div>
      ${pend ? `<span class="badge">${pend} pendiente${pend > 1 ? 's' : ''}</span>` : ''}
    </div>`;
  }).join('');
  $('#people').querySelectorAll('.card').forEach(c => c.onclick = () => { tap(); openPerson(c.dataset.id); });
}
$('#q').oninput = renderPeople;

/* ---------- Detalle de persona ---------- */
let openId = null;
function openPerson(id) {
  openId = id; renderPanel();
  requestAnimationFrame(() => $('#panel').classList.add('open'));
  $('#fab').classList.add('hide');
}
function closePerson() {
  $('#panel').classList.remove('open');
  const c = document.querySelector('.composer'); if (c) c.remove();
  openId = null; $('#fab').classList.toggle('hide', tab === 'set');
  renderPeople(); if (tab === 'cal') renderCal();
}
function row(k, v) { return `<div class="row"><div class="k">${k}</div><div class="v ${v ? '' : 'none'}">${v ? esc(v) : '—'}</div></div>`; }
function renderPanel() {
  const p = person(openId); if (!p) return closePerson();
  const g = group(p.groupId);
  const bd = p.birthday ? (() => { const d = new Date(p.birthday + 'T12:00:00'); return `${d.getDate()} de ${MES[d.getMonth()]}`; })() : '';
  $('#panel').innerHTML = `
    <div class="topbar">
      <button class="iconbtn glass press" id="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="iconbtn glass press" id="edit"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>
    </div>
    <div class="hero">
      <div class="av" style="${avStyle(g.color)}">${esc(initials(p.name))}</div>
      <div class="big">${esc(p.name)}</div>
      <span class="tag glass" style="color:${g.color}">${esc(g.name)}</span>
    </div>
    <div class="box glass">
      ${row('Truco', p.trick)}${row('La conocí', p.met)}${row('Le gusta', p.likes)}${row('Cumpleaños', bd)}
    </div>
    <h2>Pendiente preguntarle</h2>
    <div class="box glass" id="pendBox">
      ${p.pending.length ? p.pending.map(x => `<div class="pend ${x.done ? 'done' : ''}" data-id="${x.id}"><button class="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg></button><div class="t">${esc(x.text)}</div><button class="del" style="color:var(--faint)">✕</button></div>`).join('') : `<div class="row"><div class="v none">Nada por ahora. Escribe abajo y activa "pendiente".</div></div>`}
    </div>
    <h2>Pláticas</h2>
    <div class="timeline">
      ${p.notes.length ? p.notes.map((n, i) => `<div class="note glass press" data-n="${n.id}" style="animation-delay:${Math.min(i, 8) * 40}ms"><div class="d"><span>${nice(n.date)}</span><svg class="pen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></div><div class="x">${esc(n.text)}</div></div>`).join('') : `<div class="hint" style="margin-left:0">Aún no hay notas. Escribe lo que te contó.</div>`}
    </div>`;
  $('#back').onclick = () => { tap(); closePerson(); };
  $('#edit').onclick = () => { tap(); personSheet(p); };
  $('#pendBox').querySelectorAll('.pend').forEach(el => {
    const it = p.pending.find(x => x.id === el.dataset.id);
    el.querySelector('.check').onclick = () => { tap(); it.done = !it.done; save(); el.classList.toggle('done', it.done); };
    el.querySelector('.t').onclick = () => { tap(); pendSheet(p, it); };
    el.querySelector('.del').onclick = async () => { if (!(await ask('¿Quitar este pendiente?', 'Quitar'))) return; p.pending = p.pending.filter(x => x !== it); save(); renderPanel(); };
  });
  $('#panel').querySelectorAll('[data-n]').forEach(b => b.onclick = () => { tap(); noteSheet(p, p.notes.find(n => n.id === b.dataset.n)); });
  mountComposer(p);
}
function mountComposer(p) {
  let c = document.querySelector('.composer');
  if (!c) {
    c = document.createElement('div'); c.className = 'composer glass';
    c.innerHTML = `<button class="iconbtn" id="pendT" title="Marcar como pendiente" style="width:40px;height:40px;flex:none;border-radius:50%;transition:all .3s"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
      <textarea id="noteIn" rows="1" placeholder="¿Qué te contó?"></textarea>
      <button class="send" id="sendN" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>`;
    document.body.appendChild(c);
  }
  const ta = c.querySelector('#noteIn'), send = c.querySelector('#sendN'), pt = c.querySelector('#pendT');
  let asPend = false;
  const paint = () => { pt.style.background = asPend ? '#ffb84d' : 'transparent'; pt.style.color = asPend ? '#1a1a2e' : 'var(--muted)'; ta.placeholder = asPend ? 'Algo para preguntarle después' : '¿Qué te contó?'; };
  paint();
  pt.onclick = () => { tap(); asPend = !asPend; paint(); ta.focus(); };
  ta.oninput = () => { send.disabled = !ta.value.trim(); ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  send.onclick = () => {
    const txt = ta.value.trim(); if (!txt) return; tap();
    if (asPend) p.pending.unshift({ id: uid(), text: txt, done: false });
    else p.notes.unshift({ id: uid(), date: todayStr(), text: txt });
    p.updated = Date.now(); save();
    ta.value = ''; ta.style.height = 'auto'; send.disabled = true;
    toast(asPend ? 'Pendiente guardado' : 'Nota guardada');
    asPend = false; paint(); renderPanel();
  };
}

/* ---------- Hojas ---------- */
function openSheet(html, after) {
  const s = $('#sheet');
  s.innerHTML = `<div class="grab"></div>` + html;
  $('#scrim').style.display = 'block';
  requestAnimationFrame(() => { $('#scrim').classList.add('open'); s.classList.add('open'); });
  after && after(s);
}
function closeSheet() {
  $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open');
  setTimeout(() => { $('#scrim').style.display = 'none'; }, 350);
  document.activeElement && document.activeElement.blur();
}
$('#scrim').onclick = closeSheet;
let sy = null;
$('#sheet').addEventListener('touchstart', e => { if ($('#sheet').scrollTop <= 0) sy = e.touches[0].clientY; }, { passive: true });
$('#sheet').addEventListener('touchmove', e => {
  if (sy == null) return; const dy = e.touches[0].clientY - sy;
  if (dy > 0) { $('#sheet').style.transition = 'none'; $('#sheet').style.transform = `translateY(${dy}px)`; }
}, { passive: true });
$('#sheet').addEventListener('touchend', e => {
  if (sy == null) return; const dy = e.changedTouches[0].clientY - sy; sy = null;
  $('#sheet').style.transition = ''; $('#sheet').style.transform = '';
  if (dy > 110) closeSheet();
});

const groupOptions = sel => db.groups.map(g => `<option value="${g.id}" ${g.id === sel ? 'selected' : ''}>${esc(g.name)}</option>`).join('');

$('#fab').onclick = () => {
  tap();
  if (tab === 'cal') return eventSheet(selDay);
  openSheet(`<h3>Agregar</h3>
    <div class="opts">
      <button class="opt glass" id="oQuick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5ad1ff" stroke-width="2.2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg><b>Nota rápida</b><span>A alguien que ya tienes</span></button>
      <button class="opt glass" id="oNew"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff7eb6" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg><b>Nueva persona</b><span>Alguien que acabas de conocer</span></button>
    </div>`, s => {
    s.querySelector('#oNew').onclick = () => { tap(); personSheet(null); };
    s.querySelector('#oQuick').onclick = () => { tap(); if (!db.people.length) { toast('Primero agrega a alguien'); return personSheet(null); } quickSheet(); };
  });
};

function personSheet(p) {
  const isNew = !p;
  const d = p || { name: '', groupId: filter !== 'all' ? filter : db.groups[0]?.id, trick: '', met: '', likes: '', birthday: '' };
  openSheet(`<h3>${isNew ? 'Nueva persona' : 'Editar'}</h3>
    <div class="field"><label>Nombre</label><input id="fName" value="${esc(d.name)}" placeholder="Ej. Mariana López" autocomplete="off"></div>
    <div class="field"><label>Grupo</label><select id="fGroup">${groupOptions(d.groupId)}</select></div>
    <div class="field"><label>Truco para recordar su nombre</label><input id="fTrick" value="${esc(d.trick)}" placeholder="Ej. Mariana = mar, siempre habla de la playa"></div>
    <div class="field"><label>Cómo / dónde la conociste</label><input id="fMet" value="${esc(d.met)}" placeholder="Ej. Línea 3, turno matutino"></div>
    <div class="field"><label>Le gusta / datos importantes</label><textarea id="fLikes" placeholder="Ej. Café sin azúcar, tiene un perro llamado Toby">${esc(d.likes)}</textarea></div>
    <div class="field"><label>Cumpleaños</label><input id="fBd" type="date" value="${esc(d.birthday)}"></div>
    <button class="btn press" id="fSave">${isNew ? 'Agregar' : 'Guardar'}</button>
    ${isNew ? '' : '<button class="btn red press" id="fDel">Eliminar persona</button>'}`, s => {
    if (isNew) setTimeout(() => s.querySelector('#fName').focus(), 400);
    s.querySelector('#fSave').onclick = () => {
      const name = s.querySelector('#fName').value.trim();
      if (!name) { toast('Escribe un nombre'); return; }
      tap();
      const data = { name, groupId: s.querySelector('#fGroup').value, trick: s.querySelector('#fTrick').value.trim(), met: s.querySelector('#fMet').value.trim(), likes: s.querySelector('#fLikes').value.trim(), birthday: s.querySelector('#fBd').value, updated: Date.now() };
      if (isNew) { const np = { id: uid(), notes: [], pending: [], ...data }; db.people.push(np); save(); closeSheet(); renderPeople(); setTimeout(() => openPerson(np.id), 250); }
      else { Object.assign(p, data); save(); closeSheet(); renderPanel(); }
      toast(isNew ? 'Persona agregada' : 'Cambios guardados');
    };
    const del = s.querySelector('#fDel');
    if (del) del.onclick = async () => {
      if (!(await ask(`¿Eliminar a ${p.name} y todas sus notas?`, 'Eliminar'))) return;
      db.people = db.people.filter(x => x !== p);
      db.events.forEach(e => { if (e.personId === p.id) e.personId = ''; });
      save(); closeSheet(); closePerson(); toast('Eliminada');
    };
  });
}

function noteSheet(p, n) {
  openSheet(`<h3>Editar plática</h3>
    <div class="field"><label>Fecha</label><input id="nD" type="date" value="${esc(n.date)}"></div>
    <div class="field"><label>Qué te contó</label><textarea id="nT">${esc(n.text)}</textarea></div>
    <button class="btn press" id="nS">Guardar</button>
    <button class="btn red press" id="nX">Borrar plática</button>`, s => {
    s.querySelector('#nS').onclick = () => {
      const t = s.querySelector('#nT').value.trim(), d = s.querySelector('#nD').value;
      if (!t) return toast('La nota está vacía');
      tap(); n.text = t; if (d) n.date = d;
      p.notes.sort((a, b) => b.date.localeCompare(a.date));
      save(); closeSheet(); renderPanel(); toast('Plática actualizada');
    };
    s.querySelector('#nX').onclick = async () => {
      if (!(await ask('¿Borrar esta plática?'))) return;
      p.notes = p.notes.filter(x => x !== n); save(); closeSheet(); renderPanel(); toast('Plática borrada');
    };
  });
}
function pendSheet(p, it) {
  openSheet(`<h3>Editar pendiente</h3>
    <div class="field"><textarea id="pT">${esc(it.text)}</textarea></div>
    <button class="btn press" id="pS">Guardar</button>
    <button class="btn ghost press" id="pM">Pasarlo a pláticas</button>`, s => {
    s.querySelector('#pS').onclick = () => {
      const t = s.querySelector('#pT').value.trim(); if (!t) return toast('Está vacío');
      tap(); it.text = t; save(); closeSheet(); renderPanel();
    };
    s.querySelector('#pM').onclick = () => {
      tap(); const t = s.querySelector('#pT').value.trim() || it.text;
      p.pending = p.pending.filter(x => x !== it);
      p.notes.unshift({ id: uid(), date: todayStr(), text: t });
      p.updated = Date.now(); save(); closeSheet(); renderPanel(); toast('Movido a pláticas');
    };
  });
}
function quickSheet() {
  let sel = null, asPend = false;
  openSheet(`<h3>Nota rápida</h3>
    <div class="field"><input id="qs" placeholder="Buscar persona" autocomplete="off"></div>
    <div class="pick" id="qp"></div>
    <div class="toggle"><span>Es algo para preguntarle después</span><div class="sw" id="qsw"></div></div>
    <div class="field"><textarea id="qt" placeholder="¿Qué te contó?"></textarea></div>
    <button class="btn press" id="qsave">Guardar</button>`, s => {
    const draw = () => {
      const q = s.querySelector('#qs').value.trim().toLowerCase();
      const list = db.people.filter(p => p.name.toLowerCase().includes(q)).sort((a, b) => (b.updated || 0) - (a.updated || 0));
      s.querySelector('#qp').innerHTML = list.map(p => `<div class="it ${sel === p.id ? 'sel' : ''}" data-id="${p.id}"><div class="av" style="${avStyle(group(p.groupId).color)}">${esc(initials(p.name))}</div><div>${esc(p.name)}</div></div>`).join('') || `<div class="hint">No encontré a nadie.</div>`;
      s.querySelectorAll('.it').forEach(it => it.onclick = () => { tap(); sel = it.dataset.id; draw(); s.querySelector('#qt').focus(); });
    };
    draw();
    s.querySelector('#qs').oninput = draw;
    s.querySelector('#qsw').onclick = e => { tap(); asPend = !asPend; e.currentTarget.classList.toggle('on', asPend); };
    s.querySelector('#qsave').onclick = () => {
      const txt = s.querySelector('#qt').value.trim();
      if (!sel) return toast('Elige a una persona');
      if (!txt) return toast('Escribe la nota');
      tap(); const p = person(sel);
      if (asPend) p.pending.unshift({ id: uid(), text: txt, done: false });
      else p.notes.unshift({ id: uid(), date: todayStr(), text: txt });
      p.updated = Date.now(); save(); closeSheet(); renderPeople();
      toast(asPend ? 'Pendiente guardado' : 'Nota guardada');
    };
  });
}

/* ---------- Calendario ---------- */
let viewM = new Date(); viewM.setDate(1);
let selDay = todayStr();
function itemsOn(dateStr) {
  const md = dateStr.slice(5), out = [];
  db.people.forEach(p => { if (p.birthday && p.birthday.slice(5) === md) out.push({ type: 'bd', p }); });
  db.events.forEach(e => { if (e.date === dateStr) out.push({ type: 'ev', e, p: person(e.personId) }); });
  return out;
}
function gTag(p) {
  if (!p) return '';
  const g = group(p.groupId);
  return ` · <span style="color:${g.color};font-weight:600"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${g.color};margin-right:4px;vertical-align:1px"></i>${esc(g.name)}</span>`;
}
function itemHTML(it, dateStr, i) {
  if (it.type === 'bd') {
    const years = dateStr.slice(0, 4) - it.p.birthday.slice(0, 4);
    return `<div class="evt glass press" data-p="${it.p.id}" style="animation-delay:${i * 40}ms"><div class="ic" style="background:rgba(255,126,182,.18)">🎂</div><div class="tx"><b>Cumpleaños de ${esc(it.p.name)}</b><span>${nice(dateStr)}${years > 0 && years < 120 ? ` · cumple ${years}` : ''}${gTag(it.p)}</span></div></div>`;
  }
  return `<div class="evt glass press" data-e="${it.e.id}" style="animation-delay:${i * 40}ms"><div class="ic" style="background:rgba(90,209,255,.16)">📌</div><div class="tx"><b>${esc(it.e.title)}</b><span>${nice(dateStr)}${it.p ? ' · ' + esc(it.p.name) + gTag(it.p) : ''}</span></div></div>`;
}
function bindItems(root) {
  root.querySelectorAll('[data-p]').forEach(el => el.onclick = () => { tap(); openPerson(el.dataset.p); });
  root.querySelectorAll('[data-e]').forEach(el => el.onclick = () => { tap(); eventSheet(null, db.events.find(e => e.id === el.dataset.e)); });
}
function renderCal() {
  $('#mlabel').textContent = `${MES[viewM.getMonth()]} ${viewM.getFullYear()}`;
  const start = new Date(viewM); const off = (start.getDay() + 6) % 7; start.setDate(1 - off);
  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const s = ymd(d), its = itemsOn(s);
    const dots = [...new Set(its.map(x => x.type))].map(t => `<i class="i-${t}"></i>`).join('');
    html += `<button class="day ${d.getMonth() !== viewM.getMonth() ? 'out' : ''} ${s === todayStr() ? 'today' : ''} ${s === selDay ? 'sel' : ''}" data-d="${s}">${d.getDate()}<div class="dots">${dots}</div></button>`;
    if (i === 34 && d.getMonth() !== viewM.getMonth()) break;
  }
  $('#days').innerHTML = html;
  $('#days').querySelectorAll('.day').forEach(b => b.onclick = () => { tap(); selDay = b.dataset.d; renderCal(); });
  const its = itemsOn(selDay);
  $('#dayTitle').textContent = nice(selDay) === 'Hoy' ? 'Hoy' : (() => { const d = new Date(selDay + 'T12:00:00'); return `${d.getDate()} de ${MES[d.getMonth()]}`; })();
  $('#dayList').innerHTML = its.length ? its.map((x, i) => itemHTML(x, selDay, i)).join('') : `<div class="hint">Nada este día. Toca + para agregar un evento.</div>`;
  bindItems($('#dayList'));
  const up = []; const t = new Date();
  for (let i = 0; i < 30; i++) { const d = new Date(t); d.setDate(t.getDate() + i); const s = ymd(d); itemsOn(s).forEach(x => up.push([x, s])); }
  $('#upcoming').innerHTML = up.length ? up.map(([x, s], i) => itemHTML(x, s, i)).join('') : `<div class="hint">No hay nada próximo.</div>`;
  bindItems($('#upcoming'));
}
$('#prevM').onclick = () => { tap(); viewM.setMonth(viewM.getMonth() - 1); renderCal(); };
$('#nextM').onclick = () => { tap(); viewM.setMonth(viewM.getMonth() + 1); renderCal(); };

function eventSheet(date, ev) {
  const isNew = !ev;
  const d = ev || { title: '', date: date || todayStr(), personId: '' };
  openSheet(`<h3>${isNew ? 'Nuevo evento' : 'Editar evento'}</h3>
    <div class="field"><label>Qué</label><input id="eT" value="${esc(d.title)}" placeholder="Ej. Su examen final, cena, junta con su jefe" autocomplete="off"></div>
    <div class="field"><label>Fecha</label><input id="eD" type="date" value="${esc(d.date)}"></div>
    <div class="field"><label>Persona (opcional)</label><select id="eP"><option value="">Nadie</option>${db.people.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}" ${p.id === d.personId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
    <button class="btn press" id="eS">${isNew ? 'Agregar' : 'Guardar'}</button>
    ${isNew ? '' : '<button class="btn red press" id="eX">Eliminar evento</button>'}`, s => {
    if (isNew) setTimeout(() => s.querySelector('#eT').focus(), 400);
    s.querySelector('#eS').onclick = () => {
      const title = s.querySelector('#eT').value.trim(), date = s.querySelector('#eD').value;
      if (!title || !date) return toast('Falta el título o la fecha');
      tap();
      const data = { title, date, personId: s.querySelector('#eP').value };
      if (isNew) db.events.push({ id: uid(), ...data }); else Object.assign(ev, data);
      save(); selDay = date; viewM = new Date(date + 'T12:00:00'); viewM.setDate(1);
      closeSheet(); renderCal(); toast(isNew ? 'Evento agregado' : 'Guardado');
    };
    const x = s.querySelector('#eX');
    if (x) x.onclick = async () => { if (!(await ask('¿Eliminar este evento?', 'Eliminar'))) return; db.events = db.events.filter(e => e !== ev); save(); closeSheet(); renderCal(); toast('Eliminado'); };
  });
}

/* ---------- Ajustes ---------- */
function renderSettings() {
  $('#groupList').innerHTML = db.groups.map(g => `<div class="setrow press" data-g="${g.id}"><span class="dot" style="background:${g.color}"></span><span class="grow">${esc(g.name)}</span><span style="color:var(--faint);font-size:14px">${db.people.filter(p => p.groupId === g.id).length}</span></div>`).join('');
  $('#groupList').querySelectorAll('.setrow').forEach(r => r.onclick = () => { tap(); groupSheet(db.groups.find(g => g.id === r.dataset.g)); });
}
function groupSheet(g) {
  const isNew = !g; let color = g ? g.color : COLORS[db.groups.length % COLORS.length];
  openSheet(`<h3>${isNew ? 'Nuevo grupo' : 'Editar grupo'}</h3>
    <div class="field"><label>Nombre</label><input id="gN" value="${esc(g ? g.name : '')}" placeholder="Ej. Gimnasio" autocomplete="off"></div>
    <div class="colors">${COLORS.map(c => `<button data-c="${c}" style="background:${c}" class="${c === color ? 'sel' : ''}"></button>`).join('')}</div>
    <button class="btn press" id="gS">${isNew ? 'Crear' : 'Guardar'}</button>
    ${isNew ? '' : '<button class="btn red press" id="gX">Eliminar grupo</button>'}`, s => {
    s.querySelectorAll('.colors button').forEach(b => b.onclick = () => { tap(); color = b.dataset.c; s.querySelectorAll('.colors button').forEach(x => x.classList.toggle('sel', x === b)); });
    s.querySelector('#gS').onclick = () => {
      const name = s.querySelector('#gN').value.trim(); if (!name) return toast('Escribe un nombre');
      tap();
      if (isNew) db.groups.push({ id: uid(), name, color }); else Object.assign(g, { name, color });
      save(); closeSheet(); renderSettings();
    };
    const x = s.querySelector('#gX');
    if (x) x.onclick = async () => {
      const n = db.people.filter(p => p.groupId === g.id).length;
      if (db.groups.length === 1) return toast('Necesitas al menos un grupo');
      if (!(await ask(n ? `${n} persona(s) pasarán a "${db.groups.find(o => o !== g).name}". ¿Continuar?` : '¿Eliminar grupo?', 'Eliminar'))) return;
      const to = db.groups.find(o => o !== g).id;
      db.people.forEach(p => { if (p.groupId === g.id) p.groupId = to; });
      db.groups = db.groups.filter(o => o !== g);
      if (filter === g.id) filter = 'all';
      save(); closeSheet(); renderSettings();
    };
  });
}
$('#addGroup').onclick = () => { tap(); groupSheet(null); };
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `circulo-respaldo-${todayStr()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Respaldo exportado');
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.people) || !Array.isArray(d.groups)) throw 0;
      if (!(await ask('Esto reemplaza todo lo que tienes ahora. ¿Continuar?', 'Importar'))) return;
      db = { groups: d.groups, people: d.people, events: d.events || [] }; save(); renderSettings(); toast('Respaldo importado');
    } catch (x) { toast('Archivo no válido'); }
  };
  r.readAsText(f); e.target.value = '';
};
$('#wipeBtn').onclick = async () => {
  if (!(await ask('¿Borrar TODAS las personas, notas y eventos? No se puede deshacer.', 'Borrar todo'))) return;
  db = defaults(); save(); filter = 'all'; renderSettings(); toast('Todo borrado');
};

/* ---------- Inicio ---------- */
renderPeople();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
